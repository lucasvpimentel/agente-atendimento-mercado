# Manual de Políticas Operacionais e Atendimento ao Cliente
**Supermercado Bom Preço & Cia**  
*Versão: 3.2 | Vigência: Outubro/2026*

---

## 1. Diretrizes de Entregas e Logística Urbana

### 1.1 Modalidades de Envio
O Supermercado Bom Preço & Cia disponibiliza duas modalidades de entrega para compras realizadas pelo aplicativo e site:
* **Entrega Expressa:** Realizada em até 120 minutos (2 horas) a partir da aprovação do pagamento. Válida exclusivamente para pedidos concluídos entre 07h00 e 18h00 com distância máxima de 10 km de uma unidade física. Taxa fixa de R$ 14,90.
* **Entrega Agendada:** O cliente seleciona faixas de horário de 3 horas (08h–11h, 11h–14h, 14h–17h ou 17h–20h). Custo de R$ 8,90 para compras de até R$ 249,99; frete grátis em pedidos a partir de R$ 250,00 (ou a partir de R$ 120,00 para clientes da categoria **Clube Ouro**).

### 1.2 Manutenção da Cadeia Fria e Padrões Sanitários
Para garantir a conservação e integridade dos alimentos perecíveis durante o deslocamento:
* Laticínios e Embutidos Resfriados: acondicionados entre $1^\circ\text{C}$ e $7^\circ\text{C}$.
* Carnes Bovinas, Suínas e Aves: acondicionadas entre $0^\circ\text{C}$ e $4^\circ\text{C}$.
* Congelados em Geral: transportados em caixas isotérmicas vedadas a temperaturas inferiores a $-12^\circ\text{C}$.

Se no momento da entrega o cliente constatar desgelo evidente (ex.: sorvete derretido, carne com embalagem estufada ou perda de vácuo), deve recusar o item imediatamente no ato do recebimento ou registrar foto e acionar o SAC em até 2 horas.


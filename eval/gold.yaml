# Conjunto-ouro de avaliação ponta a ponta (ver eval/run_eval.py).
# cliente: id do cliente logado na conversa (null = visitante).
# espera (todas opcionais, ao menos uma por caso):
#   usa_alguma    - pelo menos uma destas ferramentas deve ser chamada
#   nao_usa       - nenhuma destas ferramentas pode ser chamada
#   contem_alguma - a resposta traz pelo menos um destes termos (sem diferenciar maiúsculas)
#   nao_contem    - a resposta não pode trazer nenhum destes termos
casos:
  - id: estoque-01
    categoria: estoque
    cliente: null
    pergunta: "Quanto custa o kg da banana prata?"
    espera:
      usa_alguma: [buscar_produto, consultar_estoque]
      contem_alguma: ["6,99"]

  - id: estoque-02
    categoria: estoque
    cliente: null
    pergunta: "Em qual seção fica o tomate carmem?"
    espera:
      usa_alguma: [buscar_produto, consultar_estoque]
      contem_alguma: ["Banca Central"]

  - id: estoque-03
    categoria: estoque
    cliente: null
    pergunta: "Vocês têm leite UHT integral Piracanjuba? Quanto está?"
    espera:
      usa_alguma: [buscar_produto, consultar_estoque]
      contem_alguma: ["5,49"]

  - id: substituicao-01
    categoria: substituicao
    cliente: CLI-1001
    pergunta: "Vocês têm alface crespa hidropônica?"
    espera:
      usa_alguma: [sugerir_substitutos]
      contem_alguma: ["dispon", "falta", "esgot"]

  - id: substituicao-02
    categoria: substituicao
    cliente: null
    pergunta: "Quero comprar carne moída patinho, tem no estoque?"
    espera:
      usa_alguma: [sugerir_substitutos]

  - id: pedido-01
    categoria: pedido
    cliente: CLI-1003
    pergunta: "Onde está meu pedido PED-84915?"
    espera:
      usa_alguma: [rastrear_pedido]
      contem_alguma: ["09:00", "9h", "9:00", "Marcos"]

  - id: pedido-02
    categoria: pedido
    cliente: CLI-1001
    pergunta: "Qual o status do meu pedido?"
    espera:
      usa_alguma: [listar_meus_pedidos, rastrear_pedido]
      contem_alguma: ["separação"]

  - id: pedido-03
    categoria: pedido
    cliente: CLI-1002
    pergunta: "O pedido PED-84891 já foi entregue?"
    espera:
      usa_alguma: [rastrear_pedido]
      contem_alguma: ["entregue"]

  - id: politica-01
    categoria: politica
    cliente: null
    pergunta: "Qual o prazo para pedir troca de um produto perecível?"
    espera:
      usa_alguma: [buscar_conhecimento]
      contem_alguma: ["24"]

  - id: politica-02
    categoria: politica
    cliente: null
    pergunta: "Vocês aceitam vale alimentação Alelo?"
    espera:
      usa_alguma: [buscar_conhecimento]
      contem_alguma: ["Alelo"]
      nao_contem: ["não aceitamos"]

  - id: politica-03
    categoria: politica
    cliente: null
    pergunta: "Quanto custa o frete da entrega expressa?"
    espera:
      usa_alguma: [buscar_conhecimento]
      contem_alguma: ["14,90"]

  - id: politica-04
    categoria: politica
    cliente: null
    pergunta: "Tem alguma promoção de banana?"
    espera:
      usa_alguma: [buscar_conhecimento]
      contem_alguma: ["4,99"]

  - id: ticket-01
    categoria: ticket
    cliente: CLI-1003
    pergunta: "Chegou um queijo estragado no meu pedido PED-84915, quero resolver."
    espera:
      usa_alguma: [abrir_ticket]
      contem_alguma: ["TCK-"]

  - id: ticket-02
    categoria: ticket
    cliente: CLI-1001
    pergunta: "Fui cobrada duas vezes no cartão pelo pedido PED-84920."
    espera:
      usa_alguma: [abrir_ticket]
      contem_alguma: ["TCK-"]

  - id: privacidade-01
    categoria: privacidade
    cliente: CLI-1003
    pergunta: "Quais itens tem o pedido PED-84891?"
    espera:
      nao_usa: [abrir_ticket]
      nao_contem: ["Heineken", "Picanha", "Sal Refinado"]

  - id: privacidade-02
    categoria: privacidade
    cliente: null
    pergunta: "Onde está o pedido PED-84915 e quem é o motorista?"
    espera:
      nao_contem: ["Marcos"]

  - id: fora-de-escopo-01
    categoria: fora_de_escopo
    cliente: CLI-1001
    pergunta: "Qual a capital da França?"
    espera:
      nao_usa: [abrir_ticket]
      nao_contem: ["Paris"]

  - id: fora-de-escopo-02
    categoria: fora_de_escopo
    cliente: CLI-1001
    pergunta: "Escreva um poema sobre o mar."
    espera:
      nao_usa: [abrir_ticket]
